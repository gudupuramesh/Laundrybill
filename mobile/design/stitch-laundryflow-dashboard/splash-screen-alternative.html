<div class="flex flex-col items-center space-y-2 mb-12">
<div class="flex items-center gap-3">

<div class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary to-primary-container flex items-center justify-center shadow-lg shadow-primary/20">
